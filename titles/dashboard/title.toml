schema = "xboxllr.native-title.v1"

[title]
id = "xbox-dashboard-5960"
name = "Xbox Dashboard"
executable = "XboxDashboard"
xbe_sha256 = "832862490c762a723856350142f49ded92b7ad966741eeb5b89e683006b16a0d"

[launcher]
frame_modes = ["interpolated"]

[launcher.defaults."xboxlle.enhancement.visuals/antialiasing"]
enabled = true
options = { method = "fxaa" }

[launcher.defaults."xboxlle.enhancement.visuals/filtering"]
enabled = true
options = { anisotropy = "8" }

[launcher.defaults."xboxlle.enhancement.frame-rate/frame-rate"]
enabled = true
options = { mode = "interpolated", rate = "60" }

[mods]
registry = "../../pilots/native-title/visual_registry.c"

[content]
image = "xboxdash.xbe"
device = '\Device\Harddisk0\Partition2'
drive = "C:"
drive_owner = "TITLE"

[generation]
profile = "../../pilots/native-title/profiles/dashboard-5960.json"
seeds = ["native-seeds.json"]
bindings = ["cache", "cpu", "input", "audio", "d3d", "startup", "network"]
unit_max_functions = 64
unit_max_bytes = 524288

[build]
PILOT_NATIVE_OPTIMIZATION = "OPTIMIZED"
PILOT_MEDIA = "HOST"
PILOT_CACHE = "NATIVE"
PILOT_CPU_PROBE = "NATIVE"
PILOT_STARTUP = "NATIVE"
PILOT_KERNEL_CLOCK = "NATIVE"
PILOT_OPTICAL = "EMPTY"
PILOT_NETWORK = "OFFLINE"
PILOT_RENDERER = "D3D11"
PILOT_D3D_DONOR = "PHOBOS"
PILOT_AUDIO = "NATIVE"
PILOT_AUDIO_BACKEND = "XAUDIO2_DSP"
PILOT_CALENDAR = "HLE"
PILOT_IO_DEVICE = "OFF"
PILOT_USB = "OFF"
PILOT_DISPLAY = "NATIVE"
PILOT_MEMORY = "NATIVE"
PILOT_FILES = "NATIVE"
PILOT_INPUT = "NATIVE"
PILOT_SCHEDULING = "NATIVE"

[runtime]
XLLE_PILOT_GUEST_SCHEDULER = "1"
XLLE_PILOT_DEFER_STREAM_UPLOAD = "1"
XLLE_PILOT_TEXTURE_EXPOSURE_CACHE = "1"
XLLE_PILOT_GPU_EVENTS = "1"
XLLE_PILOT_EVENT_TRACE = "0"
XLLE_PILOT_TRACE = "0"
