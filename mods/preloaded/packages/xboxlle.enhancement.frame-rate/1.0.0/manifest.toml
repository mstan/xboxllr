format_version = 1
id = "xboxlle.enhancement.frame-rate"
version = "1.0.0"
name = "Xbox Frame Rate"
category = "Visual enhancements"
description = "Choose one higher-frame-rate mode. Availability depends on the game's timing support."
save_compatibility = "shared"

[[target]]
system = "xbox"
native_title_mod_abi = 2

[[feature]]
id = "frame-rate"
name = "Frame presentation"
description = "Original frames stay sharp. Optional blended frames add motion blur, double edges and one frame of delay. Actual mode requires game-specific timing support."
default_enabled = false
[[option]]
feature = "frame-rate"
id = "mode"
type = "choice"
default = "original"
values = ["original", "interpolated", "actual"]
labels = ["Original (sharp)", "Blended frames (adds motion blur)", "Actual game updates"]
[[option]]
feature = "frame-rate"
id = "rate"
type = "choice"
default = "60"
values = ["60", "120"]
labels = ["60 FPS target", "120 FPS target"]
[[plugin]]
feature = "frame-rate"
id = "xboxlle.frame-rate"
