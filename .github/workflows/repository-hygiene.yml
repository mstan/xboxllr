name: Repository hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  private-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tests/test_repository_hygiene.py
      - run: python3 tests/test_eeprom_generation.py
      - run: python3 tools/check_repository_hygiene.py --history
